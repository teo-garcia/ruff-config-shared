name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Validate ruff config
        run: uv run ruff check --config src/teo_ruff_config_shared/ruff.toml src/

      - name: Consumer smoke check
        run: |
          rm -rf .tmp/consumer-smoke
          mkdir -p .tmp/consumer-smoke
          cp tests/fixtures/consumer/sample.py .tmp/consumer-smoke/sample.py
          printf 'extend = "%s"\n' "$(uv run teo-ruff-config-path)" > .tmp/consumer-smoke/ruff.extend.toml
          printf '[tool.ruff]\nextend = "ruff.extend.toml"\n' > .tmp/consumer-smoke/pyproject.toml
          uv run ruff check .tmp/consumer-smoke
          uv run ruff format --check .tmp/consumer-smoke
